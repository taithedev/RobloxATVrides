name: ATV source checks
on:
  push:
    paths:
      - "src/**"
      - "studio/**"
      - "assets/**"
      - "tests/**"
      - ".github/workflows/atv-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "studio/**"
      - "assets/**"
      - "tests/**"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/check_source_sync.py
